# Ruff runtime-safety baseline for landingLawyer

exclude = [
    ".git",
    "__pycache__",
    "migrations",
    "venv",
    "env",
    ".venv",
    "staticfiles",
    "media",
]

# Same as Black
line-length = 88

[lint]
# Block syntax and name-resolution errors that can prevent the backend from
# running. See docs/QUALITY_BASELINE.md before expanding this profile.
select = [
    "E9",
    "F63",
    "F7",
    "F82",
]

[format]
# Use Black-compatible formatting
quote-style = "double"
indent-style = "space"
line-ending = "auto"
